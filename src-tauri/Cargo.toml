[package]
name = "unfuse-desktop"
version = "1.0.0"
description = "Unfuse Desktop Application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5"
sysinfo = "0.31"
ureq = { version = "2.10", features = ["json"] }
libc = "0.2"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23.1"
lazy_static = "1.5.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
