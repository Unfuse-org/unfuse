[package]
name = "unfuse-desktop"
version = "1.0.0"
description = "Unfuse Desktop Application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
hex = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
pro = []

[dev-dependencies]
tempfile = "3.10"

